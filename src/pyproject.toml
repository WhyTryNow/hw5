[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphs_jcasaus"
version = "0.0.2"
authors = [
  { name="Jess Casaus", email="jesscasaus@gmail.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/WhyTryNow/hw5"
"Bug Tracker" = "https://github.com/WhyTryNow/hw5/issues"